<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep Cosmic Obsidian Glass Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#161c4a" />
      <stop offset="45%" stop-color="#080b22" />
      <stop offset="85%" stop-color="#040614" />
      <stop offset="100%" stop-color="#010207" />
    </radialGradient>

    <!-- Outer Frame Neon Cyber Rim -->
    <linearGradient id="neonFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915eff" />
      <stop offset="45%" stop-color="#00cea8" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Plasma Nebula Behind Monogram -->
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#915eff" stop-opacity="0.6" />
      <stop offset="38%" stop-color="#00cea8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- LEFT WING MATERIALS (Violet / Royal Indigo) -->
    <linearGradient id="lCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="lFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="30%" stop-color="#915eff" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="lSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="60%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- RIGHT WING MATERIALS (Electric Cyan / Emerald) -->
    <linearGradient id="rCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="rFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="30%" stop-color="#00cea8" />
      <stop offset="80%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="rSide" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- CENTER DIAGONAL BEAMS (Harmonious Cross-Bracing) -->
    <linearGradient id="diagL_Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915eff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="diagL_Bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="diagR_Face" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00cea8" />
    </linearGradient>
    <linearGradient id="diagR_Bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="diagBottomL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="diagBottomR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="12" y="12" width="176" height="176" rx="44" fill="url(#spaceBg)" stroke="url(#neonFrame)" stroke-width="2.5" />

  <!-- Subtle Perspective Floor Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="20" y1="142" x2="180" y2="142" />
    <line x1="26" y1="156" x2="174" y2="156" />
    <line x1="36" y1="168" x2="164" y2="168" />
    <line x1="38" y1="172" x2="68" y2="138" />
    <line x1="162" y1="172" x2="132" y2="138" />
  </g>

  <!-- Glass Sheen Overhead Specular Arch -->
  <path d="M 14,54 C 14,31 31,14 54,14 L 146,14 C 169,14 186,31 186,54 Q 100,72 14,54 Z" fill="#ffffff" opacity="0.04" />

  <!-- Core Ambient Nebula Glow -->
  <circle cx="100" cy="102" r="64" fill="url(#plasmaGlow)" />

  <!-- 3D Monogram Geometry -->
  <g id="monument-3d-m" transform="translate(0, 3)">
    <!-- 1. LEFT TOWER -->
    <!-- Left Shadow Flank -->
    <polygon points="36,68 36,140 50,148 50,76" fill="url(#lSide)" />
    <!-- Left Front Face -->
    <polygon points="50,76 50,148 70,137 70,64" fill="url(#lFront)" />
    <!-- Left Diamond Top Cap -->
    <polygon points="36,68 54,58 70,64 50,76" fill="url(#lCap)" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.9" />

    <!-- 2. RIGHT TOWER -->
    <!-- Right Front Face -->
    <polygon points="130,64 130,137 150,148 150,76" fill="url(#rFront)" />
    <!-- Right Shadow Flank -->
    <polygon points="150,76 150,148 164,140 164,68" fill="url(#rSide)" />
    <!-- Right Diamond Top Cap -->
    <polygon points="130,64 146,58 164,68 150,76" fill="url(#rCap)" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.9" />

    <!-- 3. BOLD CENTER CHEVRON (Full-Weight Diagonals) -->
    <!-- Left Diagonal: Top Bevel Surface -->
    <polygon points="54,58 70,64 100,98 88,92" fill="url(#diagL_Bevel)" opacity="0.9" />
    <!-- Left Diagonal: Front Face (Thick 24px beam) -->
    <polygon points="70,64 100,98 100,128 70,94" fill="url(#diagL_Face)" />
    <!-- Left Diagonal: Underside Shadow Face -->
    <polygon points="70,94 100,128 100,136 70,102" fill="url(#diagBottomL)" />

    <!-- Right Diagonal: Top Bevel Surface -->
    <polygon points="146,58 130,64 100,98 112,92" fill="url(#diagR_Bevel)" opacity="0.9" />
    <!-- Right Diagonal: Front Face (Thick 24px beam) -->
    <polygon points="130,64 100,98 100,128 130,94" fill="url(#diagR_Face)" />
    <!-- Right Diagonal: Underside Shadow Face -->
    <polygon points="130,94 100,128 100,136 130,102" fill="url(#diagBottomR)" />

    <!-- 4. SPECULAR LASER ACCENTS & VERTEX CONSTELLATION -->
    <!-- Center Joint Seam Specular Highlight -->
    <line x1="100" y1="98" x2="100" y2="128" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.95" />

    <!-- Pillar Front Ridge Specular Highlights -->
    <line x1="50" y1="76" x2="50" y2="148" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.45" />
    <line x1="150" y1="76" x2="150" y2="148" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.45" />

    <!-- Diagonal Top Ridge Highlights -->
    <line x1="54" y1="58" x2="100" y2="98" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.55" />
    <line x1="146" y1="58" x2="100" y2="98" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.55" />

    <!-- Glowing Vertex Nodes (Constellation Hotspots) -->
    <circle cx="54" cy="58" r="3.2" fill="#ffffff" filter="drop-shadow(0 0 6px #915eff)" />
    <circle cx="146" cy="58" r="3.2" fill="#ffffff" filter="drop-shadow(0 0 6px #00cea8)" />
    <circle cx="100" cy="98" r="2.8" fill="#ffffff" filter="drop-shadow(0 0 5px #38bdf8)" />
    <circle cx="100" cy="132" r="2.4" fill="#00cea8" filter="drop-shadow(0 0 6px #00cea8)" />
  </g>
</svg>
